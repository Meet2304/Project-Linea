<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Linea</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <div class="stack">
        <!-- Disconnected -->
        <div id="connect-view" class="connect" hidden>
          <div class="wordmark">linea</div>
          <div class="connect-tag">// see the shape of sound</div>
          <button id="connect-btn" class="btn-primary" type="button">Connect Spotify</button>
          <div id="connect-status" class="connect-status"></div>
        </div>

        <!-- Player -->
        <div id="player-view" hidden>
          <!-- Top bar: track · pin · settings · close -->
          <header class="topbar">
            <div class="track">
              <span id="track-title" class="track-title">Nothing playing</span>
              <span id="track-artist" class="track-artist">Play a song on Spotify</span>
            </div>
            <div class="topbar-actions">
              <button
                id="btn-pin"
                class="ghost-btn ghost-btn-sm btn-pin"
                type="button"
                aria-pressed="true"
                aria-label="Pin on top"
              ></button>
              <button
                id="btn-settings"
                class="ghost-btn ghost-btn-sm"
                type="button"
                aria-label="Settings"
              ></button>
              <button
                id="btn-close"
                class="ghost-btn ghost-btn-sm btn-close"
                type="button"
                aria-label="Close Linea"
              ></button>
            </div>
          </header>

          <!-- Now playing: lyrics (hero) + quiet controls -->
          <div id="now-view">
            <section id="lyrics-panel" class="lyrics">
              <div id="lyrics-list" class="lyrics-list"></div>
            </section>

            <div class="controls">
              <div class="scrub">
                <input
                  id="seek"
                  class="slider"
                  type="range"
                  min="0"
                  max="1000"
                  step="1"
                  value="0"
                  aria-label="Seek"
                />
                <div class="timecodes">
                  <span id="time-elapsed" class="mono">0:00</span>
                  <span id="time-remaining" class="mono">-0:00</span>
                </div>
              </div>

              <div class="transport">
                <button
                  id="btn-shuffle"
                  class="ghost-btn ghost-btn-sm feature-sapphire"
                  type="button"
                  aria-label="Shuffle"
                ></button>
                <button id="btn-prev" class="ghost-btn" type="button" aria-label="Previous"></button>
                <button
                  id="btn-play"
                  class="ghost-btn play-btn"
                  type="button"
                  aria-label="Play or pause"
                ></button>
                <button id="btn-next" class="ghost-btn" type="button" aria-label="Next"></button>
                <button
                  id="btn-repeat"
                  class="ghost-btn ghost-btn-sm feature-sapphire"
                  type="button"
                  aria-label="Repeat"
                ></button>
                <button
                  id="btn-lyrics"
                  class="ghost-btn ghost-btn-sm feature-amethyst"
                  type="button"
                  aria-label="Toggle lyrics"
                ></button>
              </div>
            </div>
          </div>

          <!-- Settings: occupies the same space as the now-view -->
          <div id="settings-view" hidden>
            <div class="settings-head">
              <span class="settings-title mono">Settings</span>
              <button id="set-close" class="ghost-btn ghost-btn-sm" type="button" aria-label="Close settings"></button>
            </div>
            <div class="settings-body">
              <div class="set-row">
                <span class="set-label">Theme</span>
                <button
                  id="set-theme"
                  class="switch"
                  type="button"
                  role="switch"
                  aria-checked="false"
                  aria-label="Dark theme"
                ></button>
              </div>
              <div class="set-row">
                <span class="set-label">Show lyrics</span>
                <button
                  id="set-lyrics"
                  class="switch"
                  type="button"
                  role="switch"
                  aria-checked="true"
                  aria-label="Show lyrics"
                ></button>
              </div>
              <div class="set-row">
                <span class="set-label">Click-through</span>
                <span class="set-hint mono">Ctrl+Shift+.</span>
                <button
                  id="set-clickthrough"
                  class="switch"
                  type="button"
                  role="switch"
                  aria-checked="false"
                  aria-label="Click-through"
                ></button>
              </div>
              <div class="set-row">
                <span class="set-label">Opacity</span>
                <input
                  id="set-opacity"
                  class="slider"
                  type="range"
                  min="0.6"
                  max="1"
                  step="0.02"
                  value="0.95"
                  aria-label="Panel opacity"
                />
              </div>
              <div class="set-row">
                <span class="set-label">Text size</span>
                <input
                  id="set-fontsize"
                  class="slider"
                  type="range"
                  min="12"
                  max="22"
                  step="1"
                  value="15"
                  aria-label="Lyrics text size"
                />
              </div>
            </div>
            <div class="settings-foot">
              <button id="set-disconnect" class="btn-text-danger" type="button">Disconnect Spotify</button>
            </div>
          </div>
        </div>

        <div id="toast" class="toast" hidden></div>
      </div>

      <!-- Resize grips (custom, so they sit on the panel edge not the shadow) -->
      <div class="grip grip-n" data-edge="n"></div>
      <div class="grip grip-s" data-edge="s"></div>
      <div class="grip grip-e" data-edge="e"></div>
      <div class="grip grip-w" data-edge="w"></div>
      <div class="grip grip-ne" data-edge="ne"></div>
      <div class="grip grip-nw" data-edge="nw"></div>
      <div class="grip grip-se" data-edge="se"></div>
      <div class="grip grip-sw" data-edge="sw"></div>

      <!-- Corner affordances -->
      <span class="corner corner-ne" aria-hidden="true"></span>
      <span class="corner corner-nw" aria-hidden="true"></span>
      <span class="corner corner-se" aria-hidden="true"></span>
      <span class="corner corner-sw" aria-hidden="true"></span>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
