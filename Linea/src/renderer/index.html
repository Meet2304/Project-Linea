<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Linea</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app" data-window-focus="true" data-pointer-inside="false">
      <div class="stack">
        <!-- Disconnected -->
        <div id="connect-view" class="connect" hidden>
          <div class="wordmark">linea</div>
          <div class="connect-tag">// see the shape of sound</div>
          <button id="connect-btn" class="btn-primary" type="button">Connect Spotify</button>
          <div id="connect-status" class="connect-status"></div>
        </div>

        <!-- Player -->
        <div id="player-view" hidden>
          <!-- Top bar: cymatic thumb · track · pin · settings · close -->
          <header class="topbar">
            <canvas id="thumb" class="thumb" width="64" height="64" aria-hidden="true"></canvas>
            <div class="track">
              <span id="track-title" class="track-title">Nothing playing</span>
              <span id="track-artist" class="track-artist">Play a song on Spotify</span>
            </div>
            <div class="topbar-actions">
              <button
                id="btn-pin"
                class="ghost-btn ghost-btn-sm btn-pin"
                type="button"
                aria-pressed="true"
                aria-label="Pin on top"
              ></button>
              <button
                id="btn-settings"
                class="ghost-btn ghost-btn-sm btn-settings"
                type="button"
                aria-pressed="false"
                aria-label="Settings"
              ></button>
              <button
                id="btn-close"
                class="ghost-btn ghost-btn-sm btn-close"
                type="button"
                aria-label="Close Linea"
              ></button>
            </div>
          </header>

          <!-- Now playing: lyrics (hero) + quiet controls -->
          <div id="now-view">
            <section id="lyrics-panel" class="lyrics">
              <div id="lyrics-scroll" class="lyrics-scroll">
                <div id="lyrics-list" class="lyrics-list"></div>
              </div>
              <button
                id="btn-jump"
                class="jump-btn"
                type="button"
                hidden
                aria-label="Jump to current line"
              ></button>
            </section>

            <div class="controls">
              <div class="scrub">
                <input
                  id="seek"
                  class="slider"
                  type="range"
                  min="0"
                  max="1000"
                  step="1"
                  value="0"
                  aria-label="Seek"
                />
                <div class="timecodes">
                  <span id="time-elapsed" class="mono">0:00</span>
                  <span id="time-remaining" class="mono">-0:00</span>
                </div>
              </div>

              <div class="transport">
                <button
                  id="btn-shuffle"
                  class="ghost-btn ghost-btn-sm feature-sapphire"
                  type="button"
                  aria-label="Shuffle"
                ></button>
                <button id="btn-prev" class="ghost-btn" type="button" aria-label="Previous"></button>
                <button
                  id="btn-play"
                  class="ghost-btn play-btn"
                  type="button"
                  aria-label="Play or pause"
                ></button>
                <button id="btn-next" class="ghost-btn" type="button" aria-label="Next"></button>
                <button
                  id="btn-repeat"
                  class="ghost-btn ghost-btn-sm feature-sapphire"
                  type="button"
                  aria-label="Repeat"
                ></button>
                <button
                  id="btn-lyrics"
                  class="ghost-btn ghost-btn-sm feature-amethyst"
                  type="button"
                  aria-label="Toggle lyrics"
                ></button>
              </div>
            </div>
          </div>

          <!-- Settings: occupies the same space as the now-view -->
          <div id="settings-view" hidden>
            <div id="settings-scroll-wrap" class="settings-scroll-wrap">
              <div id="settings-scroll" class="settings-scroll">
                <div class="settings-body">
                  <div class="set-row">
                    <span class="set-label">Theme</span>
                    <!-- Animated sun/moon toggle — ThemeToggleButton2 adapted from Skiper UI
                         (https://skiper-ui.com), inspired by https://toggles.dev/ -->
                    <button
                      id="set-theme"
                      class="theme-toggle"
                      type="button"
                      role="switch"
                      aria-checked="false"
                      aria-label="Dark theme"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                        fill="currentColor"
                        stroke-linecap="round"
                        viewBox="0 0 32 32"
                      >
                        <clipPath id="theme-toggle-clip">
                          <path
                            class="theme-toggle-mask"
                            d="M0-5h30a1 1 0 0 0 9 13v24H0Z"
                          />
                        </clipPath>
                        <g clip-path="url(#theme-toggle-clip)">
                          <circle class="theme-toggle-core" cx="16" cy="16" r="8" />
                          <g
                            class="theme-toggle-rays"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                          >
                            <path d="M16 5.5v-4" />
                            <path d="M16 30.5v-4" />
                            <path d="M1.5 16h4" />
                            <path d="M26.5 16h4" />
                            <path d="m23.4 8.6 2.8-2.8" />
                            <path d="m5.7 26.3 2.9-2.9" />
                            <path d="m5.8 5.8 2.8 2.8" />
                            <path d="m23.4 23.4 2.9 2.9" />
                          </g>
                        </g>
                      </svg>
                    </button>
                  </div>
                  <div class="set-row">
                    <span class="set-label">Show lyrics</span>
                    <button
                      id="set-lyrics"
                      class="switch"
                      type="button"
                      role="switch"
                      aria-checked="true"
                      aria-label="Show lyrics"
                    ></button>
                  </div>
                  <div class="set-row">
                    <span class="set-label">Timestamps</span>
                    <button
                      id="set-timestamps"
                      class="switch"
                      type="button"
                      role="switch"
                      aria-checked="false"
                      aria-label="Show lyric timestamps"
                    ></button>
                  </div>
                  <div class="set-row">
                    <span class="set-label">Click-through</span>
                    <span class="set-hint mono">Ctrl+Shift+.</span>
                    <button
                      id="set-clickthrough"
                      class="switch"
                      type="button"
                      role="switch"
                      aria-checked="false"
                      aria-label="Click-through"
                    ></button>
                  </div>
                  <div class="set-row">
                    <span class="set-label">Lyrics size</span>
                    <div class="segmented" role="group" aria-label="Lyrics size">
                      <button class="seg" type="button" data-size="small">S</button>
                      <button class="seg" type="button" data-size="medium">M</button>
                      <button class="seg" type="button" data-size="large">L</button>
                    </div>
                  </div>
                  <div id="size-preview" class="size-preview" aria-hidden="true">
                    the shape of sound
                  </div>
                </div>
                <div class="settings-foot">
                  <button id="set-disconnect" class="btn-text-danger" type="button">Disconnect Spotify</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="toast" class="toast" hidden></div>
      </div>

      <!-- Minimal song progress along the panel's bottom edge (lyrics mode). -->
      <div id="edge-progress" class="edge-progress" aria-hidden="true">
        <div class="edge-progress-fill"></div>
      </div>

      <!-- Resize grips (custom, so they sit on the panel edge not the shadow) -->
      <div class="grip grip-n" data-edge="n"></div>
      <div class="grip grip-s" data-edge="s"></div>
      <div class="grip grip-e" data-edge="e"></div>
      <div class="grip grip-w" data-edge="w"></div>
      <div class="grip grip-ne" data-edge="ne"></div>
      <div class="grip grip-nw" data-edge="nw"></div>
      <div class="grip grip-se" data-edge="se"></div>
      <div class="grip grip-sw" data-edge="sw"></div>

      <!-- Corner affordances — arcs matched to --panel-radius (20px). -->
      <svg class="corner corner-nw" viewBox="0 0 24 24" aria-hidden="true">
        <path class="corner-arc" d="M 2 22 Q 2 2 22 2" />
      </svg>
      <svg class="corner corner-ne" viewBox="0 0 24 24" aria-hidden="true">
        <path class="corner-arc" d="M 2 2 Q 22 2 22 22" />
      </svg>
      <svg class="corner corner-se" viewBox="0 0 24 24" aria-hidden="true">
        <path class="corner-arc" d="M 22 2 Q 22 22 2 22" />
      </svg>
      <svg class="corner corner-sw" viewBox="0 0 24 24" aria-hidden="true">
        <path class="corner-arc" d="M 22 22 Q 2 22 2 2" />
      </svg>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
