<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Linea</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <header class="top-bar">
        <div id="status" class="status">Not connected</div>
        <div class="actions">
          <button id="auth-btn" type="button">Connect Spotify</button>
          <button id="click-through-btn" type="button">Click-through</button>
        </div>
      </header>

      <section class="lyrics">
        <div id="lyric-prev" class="lyric-neighbor"></div>
        <div id="lyric" class="lyric-current">Play a song on Spotify</div>
        <div id="lyric-next" class="lyric-neighbor"></div>
      </section>

      <footer class="settings">
        <label>
          Opacity
          <input id="opacity-slider" type="range" min="0.2" max="1" step="0.05" value="0.9" />
        </label>
        <label>
          Size
          <input id="font-slider" type="range" min="12" max="28" step="1" value="16" />
        </label>
      </footer>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
