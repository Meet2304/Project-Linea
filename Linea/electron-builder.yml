appId: com.meet2304.linea
productName: Linea
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# Chromium ships 55 locale .pak files (45 MB) that hold *its own* browser-UI
# translations — bookmark manager, settings pages, privacy dialogs. Linea renders
# none of that UI: the tray menu is built in-app with English labels and there are
# no native dialogs. Script support for non-Latin lyrics comes from icudtl.dat,
# HarfBuzz (inside the binary) and system font fallback, none of which live here.
#
# `en-US` is the one value that works on both platforms. app-builder-lib keeps a
# locale when the wanted string equals the file stem *or* starts with `<stem>-`,
# so this matches Windows' en-US.pak exactly and macOS' en.lproj by prefix.
# Writing `en` would delete everything — Chromium has no en.pak — and only warn.
electronLanguages:
  - en-US

# Strips the WebGPU shader compiler; see the script for why it is safe here.
afterPack: scripts/afterPack.js

files:
  - out/**/*
  # The main bundle resolves the tray/window icon as out/main/../../resources/
  # icon.png, so the folder must ship inside the asar — without it Tray()
  # throws on launch and takes the rest of app-ready down with it.
  - resources/**
  - package.json

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.music
  notarize: false

win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Linea

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

dmg:
  artifactName: ${productName}-${version}.${ext}

npmRebuild: false

publish:
  provider: github
  owner: Meet2304
  repo: Project-Linea
