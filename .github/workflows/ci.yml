name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Linea

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  e2e-tests:
    name: Playwright e2e
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Linea

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Verify Mac helper protocol
        if: runner.os == 'macOS'
        run: node scripts/check-mac.mjs

      - name: Package Mac beta for acceptance testing
        if: runner.os == 'macOS'
        run: node scripts/package.mjs --mac --publish never

      - name: Launch packaged Mac app
        if: runner.os == 'macOS'
        run: node scripts/check-mac-app.mjs

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: linea-mac-beta
          path: |
            Linea/dist/*.dmg
            Linea/dist/beta-mac.yml
          if-no-files-found: error
