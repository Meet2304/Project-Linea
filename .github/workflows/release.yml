name: Release
on:
  push:
    tags: ['v*']
jobs:
  prepare:
    name: Prepare draft and release targets
    runs-on: ubuntu-latest
    outputs:
      beta: ${{ steps.targets.outputs.beta }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo 'beta=true' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"os":"windows-latest","name":"Windows"}]}' >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'beta=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"os":"windows-latest","name":"Windows"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported release tag: $TAG"
            exit 1
          fi
      - name: Create draft once before concurrent asset uploads
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
          BETA: ${{ steps.targets.outputs.beta }}
        run: |
          notes=(--generate-notes)
          if [ -f "documentation/releases/$TAG.md" ]; then notes=(--notes-file "documentation/releases/$TAG.md"); fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$BETA" = true ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false --title "$TAG" "${notes[@]}"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" "${notes[@]}"
            fi
          fi
  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Linea
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches application version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if ('v'+require('./package.json').version !== process.env.TAG) process.exit(1)"
      - name: Test
        run: bun run test
      - name: Build and upload to draft
        run: bun run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Verify overlay interactions
        run: bun run test:e2e
      - name: Verify beta update manifest
        if: needs.prepare.outputs.beta == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist/beta.yml')) { throw 'Missing beta update manifest' }
          if (Test-Path -LiteralPath 'dist/latest.yml') { throw 'Beta must not generate stable update metadata' }
  publish:
    name: Publish completed release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep existing Mac users on the legacy release
        if: needs.prepare.outputs.beta == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" .github/legacy-mac/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
      - name: Preserve stable feed for beta releases
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
