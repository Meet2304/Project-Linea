name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # electron-builder does find-or-create on the draft release, and it uploads
  # a build's artifacts concurrently. Two uploads starting together both see
  # "release doesn't exist" and both create one — a classic check-then-act
  # race, observed 8ms apart within a single job on v0.1.4. The result was two
  # drafts with the assets split across them, needing manual consolidation on
  # every release since v0.1.1.
  #
  # Serialising the platforms does not help: the race is between concurrent
  # uploads inside one job, not between jobs. Creating the draft up front does,
  # because then no uploader ever reaches the create path — a build that finds
  # an existing draft reuses it, which is why the second platform was always
  # correct.
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release if it does not already exist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft for $TAG already exists — reusing it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$TAG" --notes ""
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Linea

    strategy:
      # One platform failing should not discard the other's artifacts; the
      # release is a draft either way, so a partial result is still reviewable.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A missing client id does not fail the build — it silently produces an
      # installer that can never log in. Fail loudly here instead.
      - name: Verify Spotify client id is available
        shell: bash
        run: |
          if [ -z "$MAIN_VITE_SPOTIFY_CLIENT_ID" ]; then
            echo "::error::MAIN_VITE_SPOTIFY_CLIENT_ID is empty. Set the SPOTIFY_CLIENT_ID repository secret — a release built without it cannot connect to Spotify."
            exit 1
          fi
        env:
          MAIN_VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}

      - name: Build and publish
        run: bun run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Inlined into the main bundle at build time. Without it the client
          # id folds to '' and Vite dead-code-eliminates the entire login
          # body, leaving loginToSpotify() as nothing but its throw — so a
          # release built without this cannot connect to Spotify at all.
          # Public PKCE client id, not a confidential secret.
          MAIN_VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
